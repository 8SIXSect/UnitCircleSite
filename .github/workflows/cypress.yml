name: Run Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Start server
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for server to be ready
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 10
          command: npx wait-on http://localhost:5174

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: http://localhost:5174
          browser: chrome
